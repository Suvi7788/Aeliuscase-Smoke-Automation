trigger: none   # prevents running on every push
  
schedules:
- cron: "30 22 * * *"   # 10:30 PM UTC = 4:00 AM Sri Lanka
  displayName: Daily 4AM Playwright Run
  branches:
    include:
      - main
  always: true

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'
  displayName: 'Install Node.js'

- script: |
    echo "Checking TEST_USERNAME..."
    if [ -z "$TEST_USERNAME" ]; then echo "USERNAME MISSING"; else echo "USERNAME OK"; fi
    if [ -z "$TEST_PASSWORD" ]; then echo "PASSWORD MISSING"; else echo "PASSWORD OK"; fi
  displayName: 'Debug Environment Variables'

- script: |
    npm ci
  displayName: 'Install Dependencies'

- script: |
    npx playwright install --with-deps
  displayName: 'Install Playwright Browsers'

- script: |
    npx playwright test --grep "createEvent" --workers=4 --headed=false
  displayName: 'Run Playwright Tests'
  env:
    TEST_USERNAME: $(TEST_USERNAME)
    TEST_PASSWORD: $(TEST_PASSWORD)
- script: |
    if [ -z "$TEST_USERNAME" ]; then echo "USERNAME MISSING"; else echo "USERNAME OK"; fi
    if [ -z "$TEST_PASSWORD" ]; then echo "PASSWORD MISSING"; else echo "PASSWORD OK"; fi
  displayName: 'Check Env Vars'
  env:
    TEST_USERNAME: $(TEST_USERNAME)
    TEST_PASSWORD: $(TEST_PASSWORD)

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/results.xml'
    failTaskOnFailedTests: true
  condition: succeededOrFailed()
  displayName: 'Publish Test Results'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'playwright-report'
    artifact: 'playwright-report'
    publishLocation: 'pipeline'
  condition: succeededOrFailed()
  displayName: 'Upload Playwright HTML Report'

